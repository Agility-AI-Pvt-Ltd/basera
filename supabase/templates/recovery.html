<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Basera sign-in code</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f7f8;font-family:system-ui,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:420px;background:#ffffff;border-radius:16px;border:1px solid #e5e7eb;padding:28px 24px;">
            <tr>
              <td>
                <p style="margin:0 0 8px;font-size:13px;font-weight:700;color:#7c3aed;letter-spacing:0.04em;">BASERA</p>
                <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#111827;">Your sign-in code</h1>
                <p style="margin:0 0 20px;font-size:15px;line-height:1.5;color:#6b7280;">
                  Enter this code in the app to continue. It expires in one hour.
                </p>
                <p style="margin:0 0 24px;font-size:32px;font-weight:800;letter-spacing:0.28em;color:#111827;text-align:center;">
                  {{ .Token }}
                </p>
                <p style="margin:0;font-size:13px;line-height:1.5;color:#9ca3af;">
                  If you did not request this, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
